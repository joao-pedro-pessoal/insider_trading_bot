name: Insider Alert Bot

on:
  schedule:
    # Horas em UTC. Nova Iorque = UTC-4 (verao) / UTC-5 (inverno).
    #
    # Orcamento: ~28 corridas por dia util, ~590/mes. A ~1-2 min facturados
    # cada, fica em 600-1200 dos 2000 min/mes incluidos no plano Free.
    #
    # A frequencia e deliberadamente baixa: o Form 4 tem prazo de entrega de
    # 2 dias uteis e fica publico para todos ao mesmo tempo. Chegar 20 minutos
    # depois nao muda nada num sinal de horizonte de meses. O lookback
    # adaptativo garante que intervalos maiores nao perdem filings.

    # Mercado aberto: 13:00-19:59 UTC (09:00-15:59 ET), a cada 30min = 14
    - cron: "*/30 13-19 * * 1-5"
    # Pos-fecho, pico real de entrega: 20:00-22:59 UTC (16:00-18:59 ET), a cada 15min = 12
    - cron: "*/15 20-22 * * 1-5"
    # Apanha o resto da noite americana (filings ate as 22:00 ET) = 1
    - cron: "25 2 * * 2-6"
    # Catch-up de sabado para os filings de sexta a noite = 1
    - cron: "25 5 * * 6"

  workflow_dispatch:
    inputs:
      lookback:
        description: "Forcar janela em minutos (vazio = automatico)"
        required: false
        default: ""
      dry_run:
        description: "true = nao envia para o Telegram"
        required: false
        default: "false"

# Impede duas corridas simultaneas a escreverem na mesma DB
concurrency:
  group: insider-bot
  cancel-in-progress: false

permissions:
  contents: write   # necessario para gravar o estado da SQLite

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do branch de estado
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # A SQLite vive num branch orfao 'bot-state' para nao poluir o historico
      # do codigo com diffs binarios.
      - name: Restaurar estado
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state --depth=1
            git show origin/bot-state:alerts.db > state/alerts.db 2>/dev/null || true
            echo "Estado restaurado ($(stat -c%s state/alerts.db 2>/dev/null || echo 0) bytes)"
          else
            echo "Sem branch bot-state — arranque a frio"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr o bot
        env:
          SEC_API_KEY:      ${{ secrets.SEC_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          MIN_TRANSACTION_VALUE_USD: "25000"
          CLUSTER_WINDOW_DAYS: "7"
          SCORE_MIN_TO_SEND: "1"
          # Por 2 ou 3 para despromover compras de plano automatico 10b5-1
          SCORE_PENALTY_10B5: "0"
          # Mensagens de inicio/fim de ciclo: always | summary | errors | off
          STATUS_MESSAGES: "always"
          # Topico separado para o estado (vazio = junto dos alertas)
          STATUS_TOPIC_ID: ${{ secrets.STATUS_TOPIC_ID }}
          # Arranque a frio apenas; depois a janela e calculada da ultima corrida
          LOOKBACK_MINUTES: "90"
        run: |
          ARGS="--db state/alerts.db"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.lookback }}" ]; then
            ARGS="$ARGS --lookback ${{ github.event.inputs.lookback }}"
          fi
          python insider_bot.py $ARGS

      - name: Guardar estado
        if: always()
        run: |
          if [ ! -f state/alerts.db ]; then
            echo "Sem DB para guardar"; exit 0
          fi
          git config user.name  "insider-bot"
          git config user.email "insider-bot@users.noreply.github.com"

          TMP=$(mktemp -d)
          cp state/alerts.db "$TMP/alerts.db"

          git checkout --orphan bot-state-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 ! -name . ! -name .git ! -name state -exec rm -rf {} +
          cp "$TMP/alerts.db" alerts.db

          git add -f alerts.db
          git commit -m "estado: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push --force origin HEAD:bot-state

      # Artifact so em falha. Guardar em cada corrida criava ~900 artifacts
      # vivos ao mesmo tempo e estourava os 500 MB de storage do plano Free.
      # O branch bot-state ja e o backup do dia-a-dia.
      - name: Guardar DB como artifact (so em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alerts-db-${{ github.run_id }}
          path: state/alerts.db
          retention-days: 5
          if-no-files-found: ignore
